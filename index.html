  .boot {

</style>

<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
/* --------------------------------------------------------- persistence */
/* Wraps window.storage. Tolerates get/set OR getItem/setItem, sync or
   promise-returning. Falls back to an in-memory map so the app still runs
   (for the current session only) if no host storage is present.          */
const Store = (() => {
  const mem = new Map();
  const host = (typeof window !== 'undefined' && window.storage) ? window.storage : null;

  /* Host storage APIs differ between environments — method names, whether
     they take structured values or strings, and whether reading an unset key
     returns null or throws. Rather than assume, probe once at boot and adopt
     whichever shape actually round-trips. */
  const PAIRS = [['getItem', 'setItem'], ['get', 'set'], ['read', 'write'], ['getValue', 'setValue']];
  const PROBE_KEY = '__tj_probe__';

  let impl = null;          // { g, st, structured, unwrap }
  const log = [];           // human-readable trace, surfaced in the UI

  const unwrapValue = (v) => {
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      for (const k of ['value', 'data', 'result']) {
        if (k in v) return v[k];
      }
    }
    return v;
  };

  /* A write that throws has NOT necessarily failed — some host bridges
     complete the write and then reject while parsing their own response.
     So always read back before writing a shape off. */
  async function tryRoundTrip(g, st, payload, matches) {
    let wroteThrew = null;
    try {
      await host[st](PROBE_KEY, payload);
    } catch (e) {
      wroteThrew = (e && e.message) || String(e);
    }
    let back;
    try {
      back = unwrapValue(await host[g](PROBE_KEY));
    } catch (e) {
      log.push(g + '/' + st + ' [' + (typeof payload) + ']: write ' +
        (wroteThrew ? 'threw (' + wroteThrew + ')' : 'ok') + ', read threw (' + ((e && e.message) || e) + ')');
      return false;
    }
    if (matches(back)) {
      if (wroteThrew) log.push(g + '/' + st + ' [' + (typeof payload) + ']: write reported "' + wroteThrew + '" but the value read back correctly — treating as usable');
      return true;
    }
    log.push(g + '/' + st + ' [' + (typeof payload) + ']: write ' +
      (wroteThrew ? 'threw (' + wroteThrew + ')' : 'ok') + ', read back ' + JSON.stringify(back));
    return false;
  }

  async function probe() {
    if (!host) { log.push('window.storage is not present'); return; }
    log.push('window.storage members: ' + Object.keys(host).concat(
      Object.getPrototypeOf(host) && Object.getPrototypeOf(host) !== Object.prototype
        ? Object.getOwnPropertyNames(Object.getPrototypeOf(host)).filter((k) => k !== 'constructor')
        : []
    ).join(', '));

    for (const [g, st] of PAIRS) {
      if (typeof host[g] !== 'function' || typeof host[st] !== 'function') continue;

      // A host that keeps structured values is preferable — no double encoding.
      try {
        if (await tryRoundTrip(g, st, { __tj: 'ok' }, (b) => b && b.__tj === 'ok')) {
          impl = { g, st, structured: true };
          log.push('using ' + g + '/' + st + ' with structured values');
          return;
        }
      } catch (e) { log.push(g + '/' + st + ' (object) threw: ' + (e && e.message)); }

      try {
        if (await tryRoundTrip(g, st, 'tj-ok', (b) => b === 'tj-ok')) {
          impl = { g, st, structured: false };
          log.push('using ' + g + '/' + st + ' with JSON strings');
          return;
        }
      } catch (e) { log.push(g + '/' + st + ' (string) threw: ' + (e && e.message)); }
    }
    log.push('no usable window.storage shape found');
  }

  /* Tier 2. When the host API is unusable — or absent because the file was
     downloaded and opened directly — plain localStorage still persists. */
  function probeLocalStorage() {
    try {
      const t = '__tj_ls_probe__';
      window.localStorage.setItem(t, 'ok');
      const ok = window.localStorage.getItem(t) === 'ok';
      window.localStorage.removeItem(t);
      if (ok) {
        impl = { local: true };
        log.push('falling back to window.localStorage — persistence is per-browser, not per-account');
        return true;
      }
      log.push('localStorage did not round-trip');
    } catch (e) {
      log.push('localStorage unavailable: ' + ((e && e.message) || e));
    }
    return false;
  }

  const ready = probe()
    .catch((e) => { log.push('probe failed: ' + ((e && e.message) || e)); })
    .then(() => {
      if (!impl && !probeLocalStorage()) {
        log.push('no persistent storage available — entries will not survive a reload');
      }
    });

  return {
    ready,
    get diagnostics() { return log.slice(); },
    note(msg) { log.push(msg); },
    get ephemeral() { return !impl; },
    get mode() {
      if (!impl) return 'in-memory only';
      if (impl.local) return 'window.localStorage';
      return 'window.storage.' + impl.g + '/' + impl.st + (impl.structured ? ' (structured)' : ' (string)');
    },

    async get(k, fallback) {
      await ready;
      if (!impl) return mem.has(k) ? mem.get(k) : fallback;
      let raw;
      try {
        raw = impl.local ? window.localStorage.getItem(k) : unwrapValue(await host[impl.g](k));
      } catch (e) {
        /* Several hosts throw rather than return null for an unset key —
           that is a miss, not a failure. */
        return fallback;
      }
      if (raw === null || raw === undefined || raw === '') return fallback;
      /* Parse strings in either mode: a structured host may still be holding
         JSON written by an earlier build, or may serialise on its own. */
      if (typeof raw === 'string') {
        try { return JSON.parse(raw); } catch (e) { return raw; }
      }
      return raw;
    },

    async set(k, v) {
      await ready;
      if (!impl) { mem.set(k, v); return true; }
      try {
        if (impl.local) window.localStorage.setItem(k, JSON.stringify(v));
        else await host[impl.st](k, impl.structured ? v : JSON.stringify(v));
        return true;
      } catch (e) {
        log.push('write to "' + k + '" failed: ' + (e && e.message));
        mem.set(k, v);
        return false;
      }
    },
  };
})();

/* =====================================================================
   WALLET WATCH — what the wallets you follow are doing, market by market.
   Reads public Polymarket data: a wallet's positions, and its trades.
   Nothing here needs a key, because none of it is private.
   ===================================================================== */
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const C = {
  bg: '#FFFFFF', card: '#FFFFFF', cardAlt: '#F6F7F9', border: '#E4E7EC',
  blue: '#2E5CFF', green: '#0B7A42', red: '#C62828', amber: '#9A6400',
  orange: '#C2410C', gray: '#9AA1AC', ink: '#0B0D12', ink2: '#3F4552', ink3: '#6B7280',
};
const APP_VERSION = 'v13';
const APP_BUILT = '8 Nov 2026';
const MONO = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";

/* Green, red and orange already mean added, reduced and trimmed, so a wallet
   never wears one — otherwise a colour would say two things at once. */
const WCOLOURS = ['#4338CA', '#7C4DFF', '#0E7490', '#0891B2', '#6D28D9', '#BE185D', '#1D4ED8'];
const MINE_COLOUR = '#334155';

const K_WALLETS = 'ww_wallets';
const K_BOOKS = 'ww_books';
const K_EVENTS = 'ww_events';
const K_WATCH = 'ww_watch';
const K_PREFS = 'ww_prefs';
const K_RELAY = 'ww_relay';
const K_SYNCED = 'ww_synced';

/* ------------------------------------------------------------- helpers */
const num = (v, d = 0) => (Number.isFinite(+v) ? +v : d);
const money = (v) => {
  const a = Math.abs(num(v));
  if (a >= 1e6) return (v < 0 ? '-' : '') + '$' + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1000) return (v < 0 ? '-' : '') + '$' + Math.round(a / 1000) + 'k';
  if (a >= 1) return (v < 0 ? '-' : '') + '$' + Math.round(a);
  return (v < 0 ? '-' : '') + '$' + a.toFixed(2);
};
const signed = (kind, v) => (kind === 'ADDED' || kind === 'NEW' ? '+' : '−') + money(v);
const shortAddr = (a) => (a && a.length > 12 ? a.slice(0, 6) + '…' + a.slice(-4) : a || '');
const ago = (t, now) => {
  const s = Math.max(0, (now || Date.now()) / 1000 - t), h = s / 3600;
  if (h < 1) return Math.max(1, Math.round(s / 60)) + 'm ago';
  if (h < 36) return Math.round(h) + 'h ago';
  return Math.round(h / 24) + 'd ago';
};
const WINDOWS = [{ h: 24, l: '24h' }, { h: 48, l: '2d' }, { h: 168, l: '7d' }, { h: 720, l: '30d' }];

/* A wallet has no picture on Polymarket, so it gets a mark of its own that is
   the same every time: four squares drawn from the address. */
/* Polymarket knows most of these wallets by name and face. Use that when it
   exists and fall back to a mark generated from the address, so a wallet is
   never just a row of hex. */
function WalletMark({ w, size = 26 }) {
  const [bad, setBad] = useState(false);
  useEffect(() => { setBad(false); }, [w && w.avatar]);
  if (w && w.avatar && !bad) {
    return <img src={w.avatar} alt="" width={size} height={size} onError={() => setBad(true)}
      style={{ width: size, height: size, borderRadius: 7, flexShrink: 0, objectFit: 'cover',
        border: '1px solid ' + (w.colour || C.gray) + '55', display: 'block' }} />;
  }
  return <Identicon addr={w && w.addr} colour={w && w.colour} size={size} />;
}

function Identicon({ addr, colour, size = 26 }) {
  const cells = useMemo(() => {
    const h = String(addr || '').toLowerCase().replace(/[^0-9a-f]/g, '');
    const out = [];
    for (let i = 0; i < 9; i++) out.push(parseInt(h.charAt(i + 2) || '0', 16) > 7);
    return out;
  }, [addr]);
  const u = size / 3;
  return (
    <span style={{ width: size, height: size, borderRadius: 7, flexShrink: 0, display: 'block',
      background: (colour || C.gray) + '1A', border: '1px solid ' + (colour || C.gray) + '33',
      position: 'relative', overflow: 'hidden' }}>
      {cells.map((on, i) => (on ? (
        <span key={i} style={{ position: 'absolute', background: colour || C.gray,
          left: (i % 3) * u, top: Math.floor(i / 3) * u, width: u, height: u, opacity: 0.85 }} />
      ) : null))}
    </span>
  );
}

function MarketIcon({ src, size = 26 }) {
  const [bad, setBad] = useState(false);
  const box = { width: size, height: size, borderRadius: 7, flexShrink: 0, objectFit: 'cover',
    border: '1px solid ' + C.border, background: C.cardAlt };
  if (!src || bad) return <span style={box} />;
  return <img src={src} alt="" width={size} height={size} onError={() => setBad(true)} style={box} />;
}

/* ------------------------------------------------------------- the API */
/* Positions moved to v2 with everything else. Snake_case rows in a
   {data, pagination} envelope, paged by cursor — sending offset is a 400.
   status defaults to OPEN, which includes a settled winner you have not
   redeemed yet, so a resolved market still shows up and can be flagged. */
const POS_URL = (w, cursor) => 'https://data-api.polymarket.com/v2/positions?user=' +
  encodeURIComponent(w) + '&limit=' + pageSize() +
  (cursor ? '&cursor=' + encodeURIComponent(cursor) : '');

/* Back to the names this file speaks. Old spellings are kept as fallbacks so
   a row from either generation of the API reads the same. */
function normalizePosition(r) {
  const pick = (...names) => {
    for (const n of names) if (r[n] !== undefined && r[n] !== null) return r[n];
    return undefined;
  };
  return {
    conditionId: pick('condition_id', 'conditionId') || '',
    asset: pick('token_id', 'asset') || '',
    title: pick('title', 'market_title', 'question') || '',
    slug: pick('slug', 'market_slug') || '',
    eventSlug: pick('event_slug', 'eventSlug') || '',
    icon: pick('icon', 'image', 'imageOptimized') || null,
    outcome: pick('outcome') || '',
    size: num(pick('current_size', 'size')),
    curPrice: num(pick('current_price', 'curPrice')),
    currentValue: num(pick('current_value', 'currentValue')),
    avgPrice: num(pick('avg_price', 'avgPrice')),
    endDate: pick('end_date', 'endDate') || null,
    /* A row is finished if the API says so, by flag or by status. */
    redeemable: !!pick('redeemable') ||
      ['CLOSED', 'REDEEMABLE', 'REDEEMABLE_LOST'].indexOf(
        String(pick('status') || '').toUpperCase()) >= 0,
  };
}

/* Every open position, following the cursor to the end. The rows also carry
   who the wallet belongs to, so the owner comes back with them. */
async function fetchPositions(wallet) {
  const out = [];
  let owner = null;
  let cursor = null;
  for (let page = 0; page < 6; page++) {
    const body = await getAny(POS_URL(wallet, cursor),
      'positions' + (page ? ', page ' + (page + 1) : ''));
    const peeled = unwrapBody(body, 0);
    const rows = listIn(peeled);
    if (!rows) {
      const x = new Error('Polymarket sent no positions back (' + preview(peeled) + ')');
      x.plain = true; throw x;
    }
    rows.forEach((r) => {
      if (!r || typeof r !== 'object') return;
      if (!owner) owner = ownerFrom(r);
      out.push(normalizePosition(r));
    });
    cursor = (peeled && peeled.pagination && peeled.pagination.next_cursor) || null;
    if (!cursor) break;
  }
  return { pos: out, owner };
}

/* A row says who holds it. Pseudonyms are Polymarket's own invention for
   wallets that never picked a name, and are still better than hex. */
function ownerFrom(r) {
  const name = String((r && (r.name || r.pseudonym)) || '').trim();
  const avatar = String((r && (r.profile_image || r.profileImage)) || '').trim();
  if (!name && !avatar) return null;
  return { name: name || '', avatar: avatar || '', verified: !!(r && r.verified) };
}
/* Activity moved to v2 on 24 Oct 2026; the old path answers 410 Gone. v2
   pages by cursor rather than offset, wraps the rows in {data, pagination}
   and renames every field to snake_case. */
const ACT_URL = (w, since, cursor) => 'https://data-api.polymarket.com/v2/activity?user=' +
  encodeURIComponent(w) + '&type=TRADE&limit=' + pageSize() +
  (since ? '&start=' + Math.floor(since) : '') +
  (cursor ? '&cursor=' + encodeURIComponent(cursor) : '');

/* Back to the names the rest of this file already speaks. */
function normalizeTrade(r) {
  return {
    timestamp: r.timestamp, conditionId: r.condition_id || r.conditionId || '',
    type: r.type || '', size: r.size, price: r.price,
    usdcSize: r.usdc_size != null ? r.usdc_size : r.usdcSize,
    asset: r.token_id || r.asset || '', side: r.side || '',
    outcome: r.outcome || '', title: r.title || '', slug: r.slug || '',
    eventSlug: r.event_slug || r.eventSlug || '',
    icon: r.icon || r.image || null,
    transactionHash: r.transaction_hash || r.transactionHash || '',
    name: r.name || '', pseudonym: r.pseudonym || '',
    profile_image: r.profile_image || '',
  };
}

const OFFLINE = (typeof location !== 'undefined' && /^(file|blob):/.test(location.protocol));

/* A failure here has three flavours and only one of them is your fault, so
   the message has to say which: the browser never let the request out, the
   request went out and came back refused, or it came back as something that
   is not a list of positions. */
function readError(err) {
  const m = (err && err.message) || String(err || 'failed');
  if (err && (err.name === 'TypeError' || /load failed|failed to fetch|networkerror/i.test(m))) {
    return (OFFLINE && !RELAY)
      ? 'the page is open as a file, so the browser blocks Polymarket — open it from your web address instead'
      : RELAY
        ? 'your relay could not be reached (' + m + ') — check the address in Connection'
        : 'Polymarket does not answer browsers on other sites. Set up a relay once in Connection and this works for good.';
  }
  return m;
}

/* Polymarket's data API answers a browser only on their own site. From
   anywhere else the browser refuses the reply before the page sees it, so a
   relay has to stand in the middle: a web address of your own that fetches
   the data server-side and hands it back with permission attached. */
let RELAY = '';
function setRelay(v) { RELAY = String(v || '').trim(); }

/* A public relay is a shared service. Ask it for a dozen big pages back to
   back and it starts refusing, and a refusal without permission headers
   reaches the page as a bare network failure — the same shape as being
   offline. So: space the calls out, retry a failure a couple of times, and
   if a public relay keeps saying no, try the other public one. A relay you
   set up yourself is never swapped out from under you. */
const PUBLIC_RELAYS = [
  'https://api.allorigins.win/raw?url=',
  'https://api.codetabs.com/v1/proxy?quest=',
];
/* Talking straight to Polymarket there is no reason to hold back. Through
   a shared relay there is every reason: smaller pages, and a gap between
   calls so it does not start refusing. */
const gap = () => (RELAY ? 350 : 0);
const pageSize = () => (RELAY ? 200 : 500);
const TRIES = 3;
const TIMEOUT_MS = 22000;   // a relay that hangs is a relay that has failed

/* Set while a sync is running so the page can say what it is waiting on,
   and cleared to call the whole thing off. */
const Progress = { say: null, stopped: false };
function tell(text) { if (Progress.say) Progress.say(text); }
function stopped() { return Progress.stopped; }

let lastCall = 0;
async function pace() {
  const wait = lastCall + gap() - Date.now();
  if (wait > 0) await new Promise((r) => setTimeout(r, wait));
  lastCall = Date.now();
}

function relayChain() {
  if (!RELAY) return [''];
  const mine = PUBLIC_RELAYS.indexOf(RELAY) < 0;
  if (mine) return [RELAY];            // your own relay, used and nothing else
  return [RELAY].concat(PUBLIC_RELAYS.filter((r) => r !== RELAY));
}

function through(relay, url) {
  if (!relay) return url;
  return relay.indexOf('{url}') >= 0
    ? relay.replace('{url}', encodeURIComponent(url))
    : relay + encodeURIComponent(url);
}

async function getAny(target, label) {
  const chain = relayChain();
  const what = label || 'Polymarket';
  let last = null;
  for (let c = 0; c < chain.length; c++) {
    for (let attempt = 0; attempt < TRIES; attempt++) {
      if (stopped()) { const x = new Error('stopped'); x.stop = true; throw x; }
      await pace();
      tell(what + (attempt ? ' \u2014 try ' + (attempt + 1) + ' of ' + TRIES : '') +
        (c ? ' (backup relay)' : ''));
      try { return await once(through(chain[c], target)); }
      catch (e) {
        last = e;
        if (e && e.stop) throw e;
        /* A clear answer from Polymarket is final; only a blocked, slow or
           overloaded relay is worth trying again. */
        if (e && e.fatal) throw e;
        if (attempt < TRIES - 1) {
          tell(what + ' \u2014 no answer, waiting to try again');
          await new Promise((r) => setTimeout(r, 700 * Math.pow(2, attempt)));
        }
      }
    }
  }
  throw last || new Error('could not reach Polymarket');
}

/* One attempt, with a deadline. Without one a relay can simply never
   answer, and the sync waits for it until the end of time. */
async function once(url) {
  const ac = typeof AbortController === 'function' ? new AbortController() : null;
  let timer = null, timedOut = false;
  if (ac) timer = setTimeout(() => { timedOut = true; ac.abort(); }, TIMEOUT_MS);
  let res;
  try { res = await fetch(url, ac ? { signal: ac.signal } : undefined); }
  catch (e) {
    if (timer) clearTimeout(timer);
    const x = new Error(timedOut
      ? 'no answer in ' + Math.round(TIMEOUT_MS / 1000) + ' seconds'
      : readError(e));
    x.plain = true; throw x;
  }
  if (timer) clearTimeout(timer);
  if (!res.ok) {
    const x = new Error(res.status === 400
      ? 'Polymarket says that address is not valid (400)'
      : res.status === 429 || res.status === 503
      ? 'the relay is busy (' + res.status + ') — try again in a minute'
      : 'Polymarket returned ' + res.status + ' ' + (res.statusText || ''));
    x.plain = true;
    x.fatal = res.status === 400 || res.status === 403 || res.status === 404;
    throw x;
  }
  let j;
  try { j = await res.json(); }
  catch (e) { const x = new Error('Polymarket sent something that is not data'); x.plain = true; throw x; }
  return j;
}

/* A relay may hand back the real answer inside an envelope of its own, and
   sometimes as a string rather than parsed. Peel until there is data. */
function unwrapBody(j, depth) {
  if (typeof j === 'string') {
    try { return unwrapBody(JSON.parse(j), (depth || 0) + 1); } catch (e) { return j; }
  }
  if (!j || typeof j !== 'object' || Array.isArray(j) || (depth || 0) > 3) return j;
  for (const k of ['contents', 'body', 'response']) {
    if (j[k] != null) return unwrapBody(j[k], (depth || 0) + 1);
  }
  return j;
}

function listIn(j) {
  const b = unwrapBody(j, 0);
  if (Array.isArray(b)) return b;
  for (const k of ['data', 'positions', 'results', 'activity', 'items']) {
    if (Array.isArray(b && b[k])) return b[k];
  }
  return null;
}

/* Enough of the reply to recognise it, never enough to fill the screen. */
function preview(j) {
  let t;
  try { t = typeof j === 'string' ? j : JSON.stringify(j); } catch (e) { t = String(j); }
  t = String(t == null ? '' : t).replace(/\s+/g, ' ').trim();
  return t.length > 140 ? t.slice(0, 140) + '…' : (t || 'empty');
}

/* Trades, newest first, as far back as the widest window anyone can pick. */
async function fetchTrades(wallet, sinceSec) {
  const out = [];
  let cursor = null;
  for (let page = 0; page < 10; page++) {
    const body = await getAny(ACT_URL(wallet, sinceSec, cursor),
      'trade history' + (page ? ', page ' + (page + 1) : ''));
    const peeled = unwrapBody(body, 0);
    const rows = listIn(peeled) || [];
    rows.forEach((r) => {
      if (!r || typeof r !== 'object') return;
      const t = normalizeTrade(r);
      if (t.type && t.type !== 'TRADE') return;
      out.push(t);
    });
    cursor = (peeled && peeled.pagination && peeled.pagination.next_cursor) || null;
    if (!cursor || rows.length === 0) break;
  }
  out.sort((a, b) => num(b.timestamp) - num(a.timestamp));
  return out;
}

/* ------------------------------------------------------- shaping it up */
const mkey = (r) => String((r && (r.conditionId || r.asset)) || '').toLowerCase();

function bookFrom(raw) {
  const pos = (raw || [])
    .filter((p) => num(p.currentValue) > 0.01 && !p.redeemable)
    .map((p) => ({
      key: mkey(p), asset: p.asset, title: p.title || p.slug || 'Untitled market',
      icon: p.icon || null, slug: p.slug || '', eventSlug: p.eventSlug || '',
      outcome: String(p.outcome || '').toUpperCase(), shares: num(p.size),
      price: num(p.curPrice), value: num(p.currentValue), endDate: p.endDate || null,
    }));
  const tot = pos.reduce((a, p) => a + p.value, 0);
  pos.forEach((p) => { p.pct = tot > 0 ? p.value / tot * 100 : 0; });
  pos.sort((a, b) => b.value - a.value);
  /* Markets that have settled, kept apart: the watchlist wants to know. */
  const done = (raw || []).filter((p) => p.redeemable ||
      (num(p.curPrice, -1) >= 0 && (num(p.curPrice) <= 0.0005 || num(p.curPrice) >= 0.9995)))
    .map((p) => mkey(p));
  return { at: Date.now(), tot, pos, resolved: done };
}

/* Two runs of history, joined. The fresh copy wins where they overlap,
   because it was read against today's holdings; anything older than the
   window falls off the end. The same fill can arrive from either side, so
   identity is the transaction plus what it did, not the object. */
/* One fill's identity: the transaction plus what it did, so the same move
   read twice is still one move. */
function eventId(e) {
  return [e.hash || '', e.asset || '', e.at, e.side, e.shares].join('|');
}

function mergeEvents(kept, fresh, floor) {
  const idOf = eventId;
  const seen = {};
  const out = [];
  (fresh || []).forEach((e) => {
    const k = idOf(e);
    if (!seen[k]) { seen[k] = 1; out.push(e); }
  });
  (kept || []).forEach((e) => {
    const k = idOf(e);
    if (!seen[k] && e.at >= floor) { seen[k] = 1; out.push(e); }
  });
  return out.sort((a, b) => b.at - a.at);
}

/* A trade only becomes Added, Reduced, New or Exited once you know what the
   wallet held before it. Walk the trades back from today's holding and the
   answer falls out; a buy onto nothing is a new position, a sell down to
   nothing is an exit. */
function classify(trades, heldByAsset) {
  const byAsset = {};
  (trades || []).forEach((t) => {
    const side = String(t.side || '').toUpperCase();
    if (side !== 'BUY' && side !== 'SELL') return;
    const a = t.asset || t.conditionId;
    if (!a) return;
    (byAsset[a] || (byAsset[a] = [])).push({
      at: num(t.timestamp), side, shares: num(t.size),
      price: num(t.price) > 1 ? num(t.price) / 100 : num(t.price),
      title: t.title || t.slug || 'Untitled market', icon: t.icon || null,
      slug: t.slug || '', eventSlug: t.eventSlug || '',
      outcome: String(t.outcome || '').toUpperCase(), key: mkey(t), asset: a,
      hash: t.transactionHash || null,
    });
  });
  const out = [];
  Object.keys(byAsset).forEach((a) => {
    const list = byAsset[a].sort((x, y) => y.at - x.at);
    /* The same fill can arrive twice across a page boundary. */
    for (let i = list.length - 1; i > 0; i--) {
      const p = list[i], q = list[i - 1];
      if (p.hash && p.hash === q.hash && p.side === q.side &&
          Math.abs(p.shares - q.shares) < 1e-9) list.splice(i, 1);
    }
    let after = num(heldByAsset[a]);        // shares held now
    list.forEach((t) => {
      const before = after - (t.side === 'BUY' ? t.shares : -t.shares);
      const kind = t.side === 'BUY'
        ? (before <= 0.000001 ? 'NEW' : 'ADDED')
        : (after <= 0.000001 ? 'EXITED' : 'REDUCED');
      out.push(Object.assign({}, t, { kind, value: t.shares * t.price }));
      after = before;
    });
  });
  return out.sort((a, b) => b.at - a.at);
}

/* Everything one wallet did to one market inside the window, said once. */
function digest(events) {
  if (!events || !events.length) return null;
  const es = events.slice().sort((a, b) => a.at - b.at);
  let inn = 0, out = 0, opened = false;
  es.forEach((e) => {
    if (e.kind === 'ADDED' || e.kind === 'NEW') { inn += e.value; if (e.kind === 'NEW') opened = true; }
    else out += e.value;
  });
  const exited = es[es.length - 1].kind === 'EXITED';
  const net = inn - out;
  let kind, text;
  if (exited) { kind = 'EXITED'; text = 'Exited — ' + money(out) + ' out'; }
  else if (out === 0) { kind = opened ? 'NEW' : 'ADDED'; text = (opened ? 'Opened ' : 'Added ') + money(inn); }
  else if (inn === 0) { kind = 'REDUCED'; text = 'Reduced ' + money(out); }
  else {
    kind = net >= 0 ? 'ADDED' : 'REDUCED';
    text = 'Net ' + (net >= 0 ? '+' : '−') + money(Math.abs(net)) +
      '  (' + money(inn) + ' in, ' + money(out) + ' out)';
  }
  return { kind, text, n: es.length, last: es[es.length - 1].at, net, inn, out };
}

/* --------------------------------------------------------- the feed */
/* The badge next to this already says what happened, so this is only the
   size of it — the full sentence stays on hover. */
function amountOf(d) {
  if (d.kind === 'EXITED') return money(d.out) + ' out';
  if (d.out === 0) return money(d.inn);
  if (d.inn === 0) return money(d.out);
  return (d.net >= 0 ? '+' : '\u2212') + money(Math.abs(d.net));
}

/* The feed answers "what just happened". This answers "what has each of
   them been doing", which a list of individual fills does not: a run of adds
   becomes one number, reduce-then-exit becomes an exit, and a wallet that
   bought and sold the same market shows its net. */
function ActivitySummary({ events, wallets, byId, onOpenMarket, now }) {
  const blocks = useMemo(() => {
    const perWallet = {};
    events.forEach((e) => {
      const w = perWallet[e.w] || (perWallet[e.w] = {});
      (w[e.key] || (w[e.key] = [])).push(e);
    });
    return wallets.map((w) => {
      const markets = perWallet[w.id];
      if (!markets) return null;
      const rows = Object.keys(markets).map((k) => {
        const es = markets[k];
        const d = digest(es);
        return d && { key: k, title: es[0].title, icon: es[0].icon,
          outcome: es[0].outcome, fresh: es.some((e) => e.fresh), d };
      }).filter(Boolean).sort((a, b) => b.d.last - a.d.last);
      if (!rows.length) return null;
      const inn = rows.reduce((a, r) => a + r.d.inn, 0);
      const out = rows.reduce((a, r) => a + r.d.out, 0);
      const moves = rows.reduce((a, r) => a + r.d.n, 0);
      return { w, rows, inn, out, moves };
    }).filter(Boolean).sort((a, b) => b.rows[0].d.last - a.rows[0].d.last);
  }, [events, wallets]);

  if (!blocks.length) {
    return <div style={{ padding: 26, textAlign: 'center', color: C.ink3, fontSize: 13 }}>
      Nothing in this window.</div>;
  }
  const ROW = { display: 'grid',
    gridTemplateColumns: '32px 50px minmax(0,1fr) 108px 86px 64px',
    gap: 12, alignItems: 'center', padding: '11px 16px 11px 27px',
    borderTop: '1px solid #F2F4F7', fontSize: 13.5, lineHeight: 1.45,
    borderLeft: '3px solid transparent' };
  const NEW_ROW = Object.assign({}, ROW, { borderLeft: '3px solid ' + C.blue });
  return (
    <div>
      {blocks.map((b) => (
        <div key={b.w.id} data-summary-wallet={b.w.id}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10,
            padding: '13px 16px 9px', borderTop: '1px solid ' + C.border }}>
            <WalletMark w={b.w} size={26} />
            <span style={{ fontSize: 14, fontWeight: 700 }}>{b.w.label}</span>
            <Tiny>{b.rows.length} market{b.rows.length === 1 ? '' : 's'} ·{' '}
              {b.moves} move{b.moves === 1 ? '' : 's'}</Tiny>
            {/* A wallet that only bought has no "out" side; printing −$0.00
                for it reads as a number rather than as nothing. */}
            <span style={{ marginLeft: 'auto', fontSize: 12.5 }}>
              {b.inn > 0 && <span><span style={{ color: C.green }}>+{money(b.inn)}</span> in</span>}
              {b.inn > 0 && b.out > 0 && ' · '}
              {b.out > 0 && <span><span style={{ color: C.orange }}>−{money(b.out)}</span> out</span>}
            </span>
          </div>
          {b.rows.map((r) => (
            <div key={r.key} data-fresh={r.fresh ? '1' : undefined}
              style={r.fresh ? NEW_ROW : ROW}>
              <MarketIcon src={r.icon} size={30} />
              <Badge kind={r.outcome === 'YES' ? 'YES' : 'NO'} width={50} />
              <span data-summary-market={r.key} onClick={() => onOpenMarket(r.key)} title={r.title}
                style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                  color: C.ink2, cursor: 'pointer' }}>{r.title}</span>
              <Badge kind={r.d.kind} />
              <span style={{ textAlign: 'right', color: C.ink2,
                fontWeight: 600 }} title={r.d.text}>{amountOf(r.d)}</span>
              <Tiny style={{ textAlign: 'right' }}>{ago(r.d.last, now)}</Tiny>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

          )}
          {news} new ·{' '}
          <span style={{ color: C.green }}>+{money(inn)}</span> in ·{' '}
          <span style={{ color: C.orange }}>−{money(out)}</span> out
        </span>
      </CardHead>
      {sub === 'summary' ? (
        <ActivitySummary events={events} byId={byId} now={now}
          wallets={sel ? wallets.filter((w) => w.id === sel) : wallets}
          onOpenMarket={onOpenMarket} />
      ) : days.map((day) => (
        <div key={day.d}>
          <div style={{ fontSize: 11, letterSpacing: 0.6, textTransform: 'uppercase',
            color: C.ink3, fontWeight: 700, padding: '13px 15px 6px' }}>
            {new Date(day.at * 1000).toLocaleDateString('en-GB',
              { weekday: 'long', day: 'numeric', month: 'short' })}
          </div>
          {day.rows.map((e, i) => {
            const w = byId[e.w] || {};
            const b = books[e.w];
            const held = b && b.pos.filter((p) => p.key === e.key)[0];
            const big = b && b.pos.length ? b.pos[0].pct : 1;
            const up = e.kind === 'ADDED' || e.kind === 'NEW';
            return (
              <div key={e.at + '-' + e.asset + '-' + i} data-fresh={e.fresh ? '1' : undefined}
                style={e.fresh ? NEW_ROW : ROW}>
                <Tiny>{ago(e.at, now)}</Tiny>
                <WalletMark w={w} size={24} />
                <MarketIcon src={e.icon} size={32} />
                <Badge kind={e.kind} />
                <Badge kind={e.outcome === 'YES' ? 'YES' : 'NO'} width={46} />
                <span data-market={e.key} onClick={() => onOpenMarket(e.key)} title={e.title}
                  style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                    color: C.ink2, cursor: 'pointer' }}
                  onMouseEnter={(ev) => { ev.currentTarget.style.color = C.blue;
                    ev.currentTarget.style.textDecoration = 'underline'; }}
                  onMouseLeave={(ev) => { ev.currentTarget.style.color = C.ink2;
                    ev.currentTarget.style.textDecoration = 'none'; }}>{e.title}</span>
                <Tiny style={{ textAlign: 'right' }}>
                  {Math.round(e.shares).toLocaleString()} sh @ {Math.round(e.price * 100)}¢
                </Tiny>
                <span style={{ textAlign: 'right', fontWeight: 600, whiteSpace: 'nowrap',
                  color: up ? C.green : C.orange }}>{signed(e.kind, e.value)}</span>
                <BookShare pct={held ? held.pct : null} colour={w.colour} biggest={big} />
              </div>
            );
          })}
        </div>
      ))}
    </Card>
  );
}

/* ------------------------------------------------------ one market */
function MarketRow({ m, wallets, books, events, watched, onToggleWatch, onOpen, open, now,
  sub, onSub, pinned }) {
  const byId = {}; wallets.forEach((w) => { byId[w.id] = w; });
  const holders = m.holders;
  const tot = holders.reduce((a, h) => a + h.value, 0);
  const outs = {}; holders.forEach((h) => { outs[h.outcome] = 1; });
  const mine = events.filter((e) => e.key === m.key);
  const biggest = Math.max.apply(null, holders.map((h) => h.pct).concat([0.0001]));
  const ROW = { display: 'grid',
    gridTemplateColumns: '34px minmax(0,1fr) 54px 190px 92px 74px 26px',
    gap: 12, alignItems: 'center', padding: '13px 16px', borderTop: '1px solid #F2F4F7',
    fontSize: 13.5, lineHeight: 1.45 };

  const bars = holders.map((h) => {
    const w = byId[h.w] || {};
    const yes = h.outcome === 'YES';
    const len = Math.max(4, h.pct / biggest * 48);
    return (
      <div key={h.w} title={(w.label || '') + ' — ' + h.outcome + ', ' + h.pct.toFixed(1) +
        '% of their book'}
        style={{ position: 'relative', height: 8, background: C.cardAlt, borderRadius: 2 }}>
        <span style={Object.assign({ position: 'absolute', top: 0, bottom: 0, borderRadius: 2,
          width: len + '%', background: w.colour }, yes ? { left: '50%' } : { right: '50%' })} />
      </div>
    );
  });

  const head = (
    <div style={Object.assign({}, ROW, { cursor: pinned ? 'default' : 'pointer',
      background: pinned ? '#FCFCFD' : undefined })}
      data-mrow={m.key}
      onClick={(e) => { if (e.target.closest('[data-stop]') || pinned) return; onOpen(m.key); }}>
      <MarketIcon src={m.icon} size={34} />
      <span style={{ fontSize: 14, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden',
        textOverflow: 'ellipsis' }} title={m.title}>{m.title}</span>
<span />
      <span style={{ position: 'relative', display: 'flex', flexDirection: 'column', gap: 3 }}>
        {bars}
        <span style={{ position: 'absolute', left: '50%', top: -2, bottom: -2, width: 1,
          background: '#B9BFC9' }} />
      </span>
      <span style={{ textAlign: 'right', fontWeight: 600 }}>{money(tot)}</span>
      <Tiny style={{ textAlign: 'right' }}>
        {mine.length ? mine.length + ' move' + (mine.length === 1 ? '' : 's') : '—'}
      </Tiny>
      <span data-stop>
        <IconBtn title={watched ? 'Remove from watchlist' : 'Add to watchlist'}
          tone={watched ? C.ink3 : C.blue} onClick={() => onToggleWatch(m.key)}>
          {watched ? '×' : PLUS}
        </IconBtn>
      </span>
    </div>
  );
  if (!open) return <div>{head}</div>;

  const DROW = { display: 'grid', gridTemplateColumns: '132px 46px 78px 92px minmax(0,1fr)',
    gap: 12, alignItems: 'center', padding: '5px 0', fontSize: 12.5 };
  const tab = sub || 'summary';
  const body = tab === 'summary'
    ? holders.map((h) => {
      const w = byId[h.w] || {};
      const g = digest(mine.filter((e) => e.w === h.w));
      return (
        <div key={h.w} style={DROW}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 7, fontWeight: 600 }}>
            <Dot colour={w.colour} />{w.label}
          </span>
          <Badge kind={h.outcome === 'YES' ? 'YES' : 'NO'} width={46} />
          <span style={{ textAlign: 'right', fontWeight: 600 }}>{money(h.value)}</span>
          <BookShare pct={h.pct} colour={w.colour} biggest={(books[h.w] &&
            books[h.w].pos.length) ? books[h.w].pos[0].pct : 1} />
          <span style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
            {g ? (
              <React.Fragment>
                <span style={{ width: 84, flexShrink: 0 }}><Badge kind={g.kind} /></span>
                <Tiny style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                  {g.text} · {g.n} move{g.n === 1 ? '' : 's'} · last {ago(g.last, now)}
                </Tiny>
              </React.Fragment>
            ) : <Tiny>no moves in this window</Tiny>}
          </span>
        </div>
      );
    })
    : (mine.length ? mine.map((e, i) => {
      const w = byId[e.w] || {};
      const up = e.kind === 'ADDED' || e.kind === 'NEW';
      return (
        <div key={i} style={DROW}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 7, fontWeight: 600 }}>
            <Dot colour={w.colour} />{w.label}
          </span>
          <span style={{ width: 84 }}><Badge kind={e.kind} /></span>
          <span style={{ textAlign: 'right', fontWeight: 600, color: up ? C.green : C.orange }}>
            {signed(e.kind, e.value)}
          </span>
          <Tiny style={{ textAlign: 'right' }}>
            {Math.round(e.shares).toLocaleString()} sh @ {Math.round(e.price * 100)}¢
          </Tiny>
          <Tiny>{ago(e.at, now)}</Tiny>
        </div>
      );
    }) : <Tiny style={{ display: 'block', padding: '6px 0' }}>No moves in this window.</Tiny>);

  return (
    <div>
      {head}
      <div style={{ background: '#FCFCFD', borderTop: '1px solid ' + C.border,
        padding: '11px 15px 13px' }}>
        <div style={{ display: 'flex', gap: 6, marginBottom: 9 }}>
          <Chip on={tab === 'summary'} onClick={() => onSub(m.key, 'summary')}>Summary</Chip>
          <Chip on={tab === 'moves'} onClick={() => onSub(m.key, 'moves')}>Every move</Chip>
        </div>
        {body}
      </div>
    </div>
  );
}

/* ------------------------------------------------- markets / watchlist */
function MarketsView({ markets, index, wallets, books, events, watch, focus, onToggleWatch,
  onUnfocus, sorts, now }) {
  const [q, setQ] = useState('');
  const [open, setOpen] = useState({});
  const [sub, setSub] = useState({});
  const [msort, setMsort] = useState('value');
  const setS = (k, v) => setSub(Object.assign({}, sub, { [k]: v }));

  const common = {
    wallets, books, events, now,
    onToggleWatch, onOpen: (k) => setOpen(Object.assign({}, open, { [k]: !open[k] })),
    onSub: setS,
  };

  const hits = q.trim().length > 1
    ? markets.filter((m) => m.title.toLowerCase().indexOf(q.toLowerCase().trim()) >= 0 &&
        watch.indexOf(m.key) < 0).slice(0, 8)
    : [];

  const rows = watch.map((k) => index[k]).filter(Boolean).map((m) => {
    const outs = {}; m.holders.forEach((h) => { outs[h.outcome] = 1; });
    return { m, tot: m.holders.reduce((a, h) => a + h.value, 0), nw: m.holders.length,
      acts: events.filter((e) => e.key === m.key).length,
      dis: Object.keys(outs).length > 1 };
  });
  const cmp = { value: (a, b) => b.tot - a.tot, wallets: (a, b) => b.nw - a.nw || b.tot - a.tot,
    active: (a, b) => b.acts - a.acts || b.tot - a.tot,
    dis: (a, b) => (b.dis ? 1 : 0) - (a.dis ? 1 : 0) || b.tot - a.tot }[msort];
  rows.sort(cmp);

  const fm = focus ? index[focus] : null;
  return (
    <div>
      {fm && (
        <Card style={{ borderColor: '#C3CFFF', boxShadow: '0 0 0 2px ' + C.blue + '14' }}>
          <CardHead>
            <span style={{ fontSize: 13, fontWeight: 700 }}>Market</span>
            <Tiny>opened from the activity feed</Tiny>
            <span style={{ marginLeft: 'auto', display: 'flex', gap: 7 }}>
              {watch.indexOf(fm.key) < 0
                ? <Btn kind="primary" onClick={() => onToggleWatch(fm.key)}>+ Add to watchlist</Btn>
                : <Btn onClick={() => onToggleWatch(fm.key)}>In watchlist — remove</Btn>}
              <Btn onClick={onUnfocus}>Close</Btn>
            </span>
          </CardHead>
          <MarketRow {...common} m={fm} watched={watch.indexOf(fm.key) >= 0} pinned
            open sub={sub[fm.key]} />
        </Card>
      )}

      <Card>
        <CardHead>
          <span style={{ fontSize: 13, fontWeight: 700 }}>Watchlist</span>
          <span style={{ display: 'flex', gap: 6, marginLeft: 8, flexWrap: 'wrap' }}>
            {[['value', 'Exposure'], ['wallets', 'Most wallets'], ['active', 'Most active'],
              ['dis', 'Disagreement']].map((s) => (
              <Chip key={s[0]} on={msort === s[0]} onClick={() => setMsort(s[0])}>{s[1]}</Chip>
            ))}
          </span>
          <span style={{ marginLeft: 'auto', fontSize: 12, color: C.ink3 }}>
            {watch.length} market{watch.length === 1 ? '' : 's'}
          </span>
        </CardHead>
        <div style={{ padding: '11px 15px' }}>
          <input value={q} onChange={(e) => setQ(e.target.value)}
            placeholder="Search any market these wallets are in, then add it…"
            style={{ width: '100%', border: '1px solid ' + C.border, borderRadius: 8,
              padding: '10px 13px', font: 'inherit', fontSize: 13.5, outline: 'none' }} />
        </div>
        {hits.map((m) => (
          <div key={m.key} style={{ display: 'flex', alignItems: 'center', gap: 10,
            padding: '10px 16px', borderTop: '1px solid #F2F4F7' }}>
            <MarketIcon src={m.icon} size={28} />
            <span style={{ flex: 1, minWidth: 0, fontSize: 13.5, whiteSpace: 'nowrap',
              overflow: 'hidden', textOverflow: 'ellipsis' }}>{m.title}</span>
            <Tiny>{m.holders.length} wallet{m.holders.length === 1 ? '' : 's'}</Tiny>
            <IconBtn title="Add to watchlist" tone={C.blue}
              onClick={() => { onToggleWatch(m.key); setQ(''); }}>{PLUS}</IconBtn>
          </div>
        ))}
        {q.trim().length > 1 && !hits.length && (
          <div style={{ padding: '8px 15px', borderTop: '1px solid #F2F4F7' }}>
            <Tiny>Nothing matches, or it is already on the list.</Tiny>
          </div>
        )}
        {rows.length === 0 && (
          <div style={{ padding: 24, textAlign: 'center', color: C.ink3, fontSize: 13 }}>
            Your own markets are added here on their own. Search above to follow others.
          </div>
        )}
        {rows.map((r) => (
          <div key={r.m.key}>
            <MarketRow {...common} m={r.m} watched open={!!open[r.m.key]} sub={sub[r.m.key]} />
            {r.m.gone && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 15px 10px',
                background: '#FFF8E6', borderTop: '1px solid #F0DFB0', fontSize: 12.5,
                color: '#6B5420' }}>
                <span style={{ flex: 1 }}>
                  {r.m.resolved
                    ? 'This market has resolved.'
                    : 'Nobody you follow holds this any more.'}
                </span>
                <Btn onClick={() => onToggleWatch(r.m.key)}>Remove from watchlist</Btn>
              </div>
            )}
          </div>
        ))}
      </Card>
    </div>
  );
}

/* ----------------------------------------------------------- wallets */
function WalletsView({ wallets, books, events, now }) {
  const [sort, setSort] = useState('size');
  return (
    <div>
      {wallets.map((w) => {
        const b = books[w.id];
        if (!b) return null;
        const touched = {};
        events.filter((e) => e.w === w.id).forEach((e) => {
          if (!touched[e.key] || e.at > touched[e.key].at) touched[e.key] = e;
        });
        const ps = b.pos.slice().sort(sort === 'size'
          ? (x, y) => y.value - x.value
          : (x, y) => ((touched[y.key] ? touched[y.key].at : 0) -
              (touched[x.key] ? touched[x.key].at : 0)) || y.value - x.value);
        const big = b.pos.length ? b.pos[0].pct : 1;
        const ROW = { display: 'grid',
          gridTemplateColumns: '32px 50px minmax(0,1fr) 84px 96px 92px', gap: 12,
          alignItems: 'center', padding: '11px 16px', borderTop: '1px solid #F2F4F7',
          fontSize: 13.5, lineHeight: 1.45 };
        return (
          <Card key={w.id}>
            <CardHead>
              <WalletMark w={w} size={26} />
              <span style={{ fontSize: 13, fontWeight: 700 }}>{w.label}</span>
              <span style={{ display: 'flex', gap: 6, marginLeft: 8 }}>
                {[['size', 'Size'], ['recent', 'Recently moved']].map((s) => (
                  <Chip key={s[0]} on={sort === s[0]} onClick={() => setSort(s[0])}>{s[1]}</Chip>
                ))}
              </span>
              <span style={{ marginLeft: 'auto', fontSize: 12, color: C.ink3 }}>
                {money(b.tot)} · {b.pos.length} markets
              </span>
            </CardHead>
            {ps.slice(0, 14).map((p) => {
              const t = touched[p.key];
              return (
                <div key={p.key + p.asset} style={ROW}>
                  <MarketIcon src={p.icon} size={30} />
                  <Badge kind={p.outcome === 'YES' ? 'YES' : 'NO'} width={46} />
                  <span title={p.title} style={{ whiteSpace: 'nowrap', overflow: 'hidden',
                    textOverflow: 'ellipsis', color: C.ink2 }}>{p.title}</span>
                  <span style={{ textAlign: 'right', fontWeight: 600 }}>{money(p.value)}</span>
                  <BookShare pct={p.pct} colour={w.colour} biggest={big} />
                  <span style={{ textAlign: 'right' }}>
                    {t ? <Badge kind={t.kind} /> : <Tiny>—</Tiny>}
                  </span>
                </div>
              );
            })}
            {b.pos.length > 14 && (
              <div style={{ padding: '8px 15px', borderTop: '1px solid #F2F4F7' }}>
                <Tiny>+ {b.pos.length - 14} smaller positions</Tiny>
              </div>
            )}
          </Card>
        );
      })}
    </div>
  );
}

  const a = addr.trim().toLowerCase();
  const ok = /^0x[0-9a-f]{40}$/.test(a);

    <Modal title="Follow a wallet" onClose={onClose}>

        textTransform: 'uppercase', color: C.ink2 }}>Wallet address</label>
      <input value={addr} onChange={(e) => setAddr(e.target.value)} autoFocus
        placeholder="0x…" style={Object.assign({}, inp, { fontFamily: MONO, fontSize: 12.5 })} />
      <Tiny style={{ display: 'block', marginTop: 6 }}>
        {dup ? 'You already follow that one.'
          : a && !ok ? 'That is not a 42-character address.'
          : 'Public, on-chain, and readable by anyone. Nothing you paste here can move funds.'}
      </Tiny>
      <div style={{ marginTop: 16 }}>
        <label style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: 0.6,
          textTransform: 'uppercase', color: C.ink2 }}>Name it</label>
        <input value={label} onChange={(e) => setLabel(e.target.value)}
          placeholder="Forecaster" style={inp} />
      </div>
      <label style={{ display: 'flex', gap: 9, alignItems: 'center', marginTop: 15,
        fontSize: 13, color: C.ink2, cursor: 'pointer' }}>
        <input type="checkbox" checked={mine} onChange={(e) => setMine(e.target.checked)} />
        This one is mine — watch everything it holds
      </label>
      <div style={{ display: 'flex', gap: 8, marginTop: 20 }}>
        <Btn kind="primary" disabled={!ok || dup}
          onClick={() => onSave({ addr: a, label: label.trim() || shortAddr(a),
            named: !!label.trim(), mine })}>
          Follow
        </Btn>
        <Btn onClick={onClose}>Cancel</Btn>
      </div>
    </Modal>
  );
}


/* ------------------------------------------------------ the connection */
const RELAY_PRESETS = [
  { id: 'direct', label: 'Straight to Polymarket', url: '',
    note: 'What you want. Nothing sits in the middle, nothing to set up, and it is the fastest. Leave it here unless a sync comes back blocked.' },
  { id: 'allorigins', label: 'Public relay (allorigins.win)',
    url: 'https://api.allorigins.win/raw?url=',
    note: 'Only if going straight is blocked. A stranger’s server sees which wallets you look at — all public information, and it can never move funds. Often slow or busy.' },
  { id: 'codetabs', label: 'Public relay (codetabs.com)',
    url: 'https://api.codetabs.com/v1/proxy?quest=',
    note: 'A second one to fall back on. Same trade-off.' },
];

function ConnectionModal({ value, onSave, onClose }) {
  const [v, setV] = useState(value || '');
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);
  const inp = { width: '100%', border: '1px solid ' + C.border, borderRadius: 7,
    padding: '9px 11px', font: 'inherit', fontSize: 12.5, fontFamily: MONO,
    outline: 'none', marginTop: 6 };

  /* A real wallet with real positions, so a pass means a pass. */
  const test = async () => {
    setBusy(true); setResult(null);
    const probe = 'https://data-api.polymarket.com/v2/positions?user=' +
      '0x7c3db723f1d4d8cb9c550095203b686cb11e5c6b&limit=3';
    const t = String(v || '').trim();
    const url = !t ? probe
      : t.indexOf('{url}') >= 0 ? t.replace('{url}', encodeURIComponent(probe))
      : t + encodeURIComponent(probe);
    try {
      const res = await fetch(url);
      const text = await res.text();
      let j = null, parsed = true;
      try { j = JSON.parse(text); } catch (e) { parsed = false; }
      if (!res.ok) {
        setResult({ ok: false, m: 'The relay answered ' + res.status + '. ' +
          preview(parsed ? j : text) });
      } else if (!parsed) {
        setResult({ ok: false, m: 'Not data at all \u2014 it sent: ' + preview(text) });
      } else {
        const arr = listIn(j);
        setResult(arr
          ? { ok: true, m: 'Working \u2014 read ' + arr.length + ' position' + (arr.length === 1 ? '' : 's') + '.' }
          : { ok: false, m: 'It answered with: ' + preview(j) });
      }
    } catch (e) {
      setResult({ ok: false, m: t
        ? 'Could not reach that address.'
        : 'Blocked \u2014 try one of the relays above.' });
    }
    setBusy(false);
  };

  return (
    <Modal title="Connection" onClose={onClose}>
      <Tiny style={{ display: 'block', lineHeight: 1.55 }}>
        This page reads Polymarket directly, which is how it should be. A relay \u2014 an
        address that fetches the data on the page\u2019s behalf \u2014 is only worth
        setting up if a sync comes back saying the browser blocked it.
      </Tiny>

      <div style={{ marginTop: 16, display: 'grid', gap: 8 }}>
        {RELAY_PRESETS.map((r) => (
          <button key={r.id} onClick={() => { setV(r.url); setResult(null); }}
            style={{ textAlign: 'left', cursor: 'pointer', font: 'inherit',
              border: '1px solid ' + (String(v || '').trim() === r.url ? C.blue : C.border),
              background: String(v || '').trim() === r.url ? C.blue + '0C' : C.card,
              borderRadius: 8, padding: '10px 12px' }}>
            <div style={{ fontSize: 13, fontWeight: 650 }}>{r.label}</div>
            <Tiny style={{ display: 'block', marginTop: 3, lineHeight: 1.5 }}>{r.note}</Tiny>
          </button>
        ))}
      </div>

      <div style={{ marginTop: 16 }}>
        <label style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: 0.6,
          textTransform: 'uppercase', color: C.ink2 }}>Relay address</label>
        <input value={v} onChange={(e) => { setV(e.target.value); setResult(null); }}
          placeholder="https://\u2026/?url=" style={inp} />
        <Tiny style={{ display: 'block', marginTop: 6, lineHeight: 1.5 }}>
          Empty means straight to Polymarket. Your own relay goes here, ending in <code>?url=</code>.
        </Tiny>
      </div>

      {result && (
        <div style={{ marginTop: 12, fontSize: 12.5, fontWeight: 600, lineHeight: 1.5,
          wordBreak: 'break-word', color: result.ok ? C.green : C.red }}>{result.m}</div>
      )}

      <div style={{ display: 'flex', gap: 8, marginTop: 18 }}>
        <Btn kind="primary" onClick={() => onSave(String(v || '').trim())}>Save</Btn>
        <Btn onClick={test} disabled={busy}>{busy ? 'Testing\u2026' : 'Test it'}</Btn>
        <Btn onClick={onClose}>Cancel</Btn>
      </div>
    </Modal>
  );
}

/* ----------------------------------------------------------- the app */
function App() {
  const [ready, setReady] = useState(false);
  const [wallets, setWallets] = useState([]);
  const [books, setBooks] = useState({});
  const [events, setEvents] = useState({});
  const [watch, setWatch] = useState([]);
  const [tab, setTab] = useState('activity');
  const [win, setWin] = useState(168);
  const [sel, setSel] = useState(null);
  const [hidden, setHidden] = useState({});
  const [focus, setFocus] = useState(null);
  const [adding, setAdding] = useState(false);
  const [conn, setConn] = useState(false);
  const [relay, setRelayV] = useState('');
  const [syncing, setSyncing] = useState(false);
  const [status, setStatus] = useState(OFFLINE
    ? { kind: 'error', text: 'This page is open as a file, so the browser will not let it reach ' +
        'Polymarket. Put it on your GitHub Pages address and open it there.' }
    : null);
  const [now, setNow] = useState(Date.now());

  const wRef = useRef([]); const bRef = useRef({}); const eRef = useRef({}); const watRef = useRef([]);
  const syRef = useRef({});
  const putWallets = (v) => { wRef.current = v; setWallets(v); Store.set(K_WALLETS, v); };
  const putBooks = (v) => { bRef.current = v; setBooks(v); Store.set(K_BOOKS, v); };
  const putEvents = (v) => { eRef.current = v; setEvents(v); Store.set(K_EVENTS, v); };
  const putWatch = (v) => { watRef.current = v; setWatch(v); Store.set(K_WATCH, v); };
  /* When each wallet was last read, so the next read can start there. */
  const putSynced = (v) => { syRef.current = v; Store.set(K_SYNCED, v); };

  useEffect(() => {
    (async () => {
      const w = await Store.get(K_WALLETS, []);
      const b = await Store.get(K_BOOKS, {});
      const e = await Store.get(K_EVENTS, {});
      const t = await Store.get(K_WATCH, []);
      const p = await Store.get(K_PREFS, null);
      const sy = await Store.get(K_SYNCED, {});
      syRef.current = (sy && typeof sy === 'object') ? sy : {};
      const rl = await Store.get(K_RELAY, '');
      setRelay(rl); setRelayV(typeof rl === 'string' ? rl : '');
      wRef.current = Array.isArray(w) ? w : []; setWallets(wRef.current);
      bRef.current = (b && typeof b === 'object') ? b : {}; setBooks(bRef.current);
      eRef.current = (e && typeof e === 'object') ? e : {}; setEvents(eRef.current);
      watRef.current = Array.isArray(t) ? t : []; setWatch(watRef.current);
      if (p && typeof p === 'object') {
        if (WINDOWS.some((x) => x.h === p.win)) setWin(p.win);
        if (p.tab) setTab(p.tab);
        if (p.hidden && typeof p.hidden === 'object') setHidden(p.hidden);
      }
      setReady(true);
    })();
  }, []);
  useEffect(() => { if (ready) Store.set(K_PREFS, { win, tab, hidden }); }, [ready, win, tab, hidden]);

  /* ---- sync */
  const sync = useCallback(async (full) => {
    const ws = wRef.current;
    if (!ws.length || syncing) return;
    setSyncing(true);
    Progress.stopped = false;
    /* The window the app will ever show. Everything older is dropped. */
    const floor = Math.floor(Date.now() / 1000) - 45 * 86400;
    /* And the point each wallet is read from: the whole window the first
       time, and only what has happened since the last read after that, with
       two hours of overlap so nothing can slip through the seam. */
    const marks = Object.assign({}, syRef.current);
    const startFor = (w) => {
      if (full) return floor;
      const had = num(marks[w.id]);
      return had > 0 ? Math.max(floor, had - 2 * 3600) : floor;
    };
    const nb = Object.assign({}, bRef.current), ne = Object.assign({}, eRef.current);
    const failed = [];
    const named = {};

    /* Wallets are read at the same time rather than one after another, and
       each wallet's positions and history are read at the same time as each
       other, so the whole sync takes about as long as its slowest wallet
       instead of the sum of all of them. */
    let done = 0, note = '';
    const say = () => setStatus({ kind: 'info',
      text: 'Reading ' + ws.length + ' wallet' + (ws.length === 1 ? '' : 's') +
        '\u2026 ' + done + ' done' + (note ? ' \u00b7 ' + note : '') });
    /* Calls overlap now, so the note is whatever was last asked for rather
       than a single thread of work \u2014 enough to show it is alive, and to
       show a retry when one happens. */
    Progress.say = (what) => { note = what; say(); };
    say();

    await Promise.all(ws.map(async (w) => {
      try {
        const from = startFor(w);
        const [book, trades] = await Promise.all([
          fetchPositions(w.addr),
          fetchTrades(w.addr, from).catch(() => []),
        ]);
        nb[w.id] = bookFrom(book.pos);
        const held = {};
        book.pos.forEach((p) => { held[p.asset] = num(p.size); });
        const fresh = classify(trades, held).filter((t) => t.at >= from)
          .map((t) => Object.assign({ w: w.id }, t));
        /* A full read replaces the history; a catch-up is folded into it. */
        const kept = eRef.current[w.id] || [];
        const list = (full || from <= floor)
          ? fresh.filter((t) => t.at >= floor)
          : mergeEvents(kept, fresh, floor);
        /* What this sync actually brought in, so the feed can mark it. On a
           wallet's first read nothing is marked \u2014 all of it is new, and a
           page of stripes says nothing. A full re-read finds the same moves
           again, so it marks nothing either. */
        const before = {};
        kept.forEach((e) => { before[eventId(e)] = 1; });
        const hadBefore = kept.length > 0;
        ne[w.id] = list.map((e) => Object.assign({}, e,
          { fresh: hadBefore && !before[eventId(e)] }));
        marks[w.id] = Math.floor(Date.now() / 1000);
        /* Who it belongs to, from the positions or, failing that, a trade. */
        const o = book.owner ||
          (trades.length ? ownerFrom(trades[0]) : null);
        if (o) named[w.id] = o;
      } catch (err) {
        if (err && err.stop) failed.push({ label: w.label, why: 'stopped' });
        else failed.push({ label: w.label,
          why: (err && err.plain) ? err.message : readError(err) });
      }
      done += 1; say();
    }));

    /* A name you typed is yours to keep; one we invented gets replaced. */
    if (Object.keys(named).length) {
      const next = wRef.current.map((w) => {
        const o = named[w.id];
        if (!o) return w;
        const auto = !w.named || w.label === shortAddr(w.addr);
        return Object.assign({}, w, {
          avatar: o.avatar || w.avatar || '',
          label: (auto && o.name) ? o.name : w.label,
        });
      });
      putWallets(next);
    }

    putBooks(nb); putEvents(ne); putSynced(marks); setNow(Date.now());

    /* Your own markets follow themselves onto the list. */
    const mineIds = ws.filter((w) => w.mine).map((w) => w.id);
    const add = [];
    mineIds.forEach((id) => {
      const bk = nb[id];
      if (bk) bk.pos.forEach((p) => {
        if (watRef.current.indexOf(p.key) < 0 && add.indexOf(p.key) < 0) add.push(p.key);
      });
    });
    if (add.length) putWatch(watRef.current.concat(add));

    Progress.say = null;
    const wasStopped = Progress.stopped;
    Progress.stopped = false;
    setSyncing(false);
    if (wasStopped) {
      setStatus({ kind: 'info', text: 'Stopped. Whatever was read before you stopped is kept.' });
      return;
    }
    const reasons = failed.map((f) => f.why);
    const same = reasons.length && reasons.every((r) => r === reasons[0]);
    setStatus(failed.length
      ? { kind: 'error', text: failed.length === ws.length
            ? 'No wallet could be read — ' + reasons[0]
            : 'Could not read ' + failed.map((f) => f.label).join(', ') +
              (same ? ' — ' + reasons[0] : '. ' + failed.map((f) => f.label + ': ' + f.why).join('; ')) }
      : { kind: 'ok', text: 'Synced ' + new Date().toLocaleTimeString('en-US',
          { hour: '2-digit', minute: '2-digit' }) + ' · ' + ws.length + ' wallet' +
          (ws.length === 1 ? '' : 's') + (full ? ' · full re-read' : '') +
          (add.length ? ' · ' + add.length + ' added to the watchlist' : '') });
  }, [syncing]);

  /* ---- derived */
  /* Two different audiences. The feed is for watching other people, so your
     own wallet is never in it — you know what you did. The markets tab is
     for comparing, where leaving yourself out would defeat the point, so you
     are always there and the eye governs everyone else. */
  const forMarkets = useMemo(() => wallets.filter((w) => w.mine || !hidden[w.id]),
    [wallets, hidden]);
  const forFeed = useMemo(() => wallets.filter((w) => !w.mine && !hidden[w.id]),
    [wallets, hidden]);
  const cutoff = Math.floor(now / 1000) - win * 3600;
  const allEvents = useMemo(() => {
    const out = [];
    forFeed.forEach((w) => { (events[w.id] || []).forEach((e) => {
      if (e.at >= cutoff) out.push(e); }); });
    return out.sort((a, b) => b.at - a.at);
  }, [forFeed, events, cutoff]);
  const feed = useMemo(() => (sel ? allEvents.filter((e) => e.w === sel) : allEvents),
    [allEvents, sel]);
  /* The comparison counts your own moves even though the feed does not. */
  const marketEvents = useMemo(() => {
    const out = [];
    forMarkets.forEach((w) => { (events[w.id] || []).forEach((e) => {
      if (e.at >= cutoff) out.push(e); }); });
    return out.sort((a, b) => b.at - a.at);
  }, [forMarkets, events, cutoff]);
  const counts = useMemo(() => {
    const m = {};
    wallets.forEach((w) => { m[w.id] = (events[w.id] || []).filter((e) => e.at >= cutoff).length; });
    return m;
  }, [wallets, events, cutoff]);

  /* every market anyone in the comparison holds, or touched in the window */
  const index = useMemo(() => {
    const ix = {};
    const put = (key, title, icon) => {
      if (!key) return null;
      if (!ix[key]) ix[key] = { key, title, icon: icon || null, holders: [], resolved: false };
      if (icon && !ix[key].icon) ix[key].icon = icon;
      if (title && title.length < ix[key].title.length) ix[key].title = title;
      return ix[key];
    };
    forMarkets.forEach((w) => {
      const b = books[w.id];
      if (b) {
        b.pos.forEach((p) => {
          const m = put(p.key, p.title, p.icon);
          if (m) m.holders.push({ w: w.id, outcome: p.outcome, value: p.value, pct: p.pct });
        });
        (b.resolved || []).forEach((k) => { if (ix[k]) ix[k].resolved = true; });
      }
      (events[w.id] || []).forEach((e) => { if (e.at >= cutoff) put(e.key, e.title, e.icon); });
    });
    Object.keys(ix).forEach((k) => { ix[k].gone = ix[k].resolved || ix[k].holders.length === 0; });
    return ix;
  }, [forMarkets, books, events, cutoff]);
  const markets = useMemo(() => Object.keys(index).map((k) => index[k])
    .sort((a, b) => b.holders.reduce((s, h) => s + h.value, 0) -
      a.holders.reduce((s, h) => s + h.value, 0)), [index]);

  const toggleWatch = useCallback((k) => {
    const i = watRef.current.indexOf(k);
    putWatch(i < 0 ? watRef.current.concat([k]) : watRef.current.filter((x) => x !== k));
  }, []);
  const addWallet = useCallback((d) => {
    const used = wRef.current.map((w) => w.colour);
    const colour = d.mine ? MINE_COLOUR :
      (WCOLOURS.filter((c) => used.indexOf(c) < 0)[0] || WCOLOURS[wRef.current.length % WCOLOURS.length]);
    putWallets(wRef.current.concat([{ id: 'w' + Date.now().toString(36), addr: d.addr,
      label: d.label, named: !!d.named, avatar: '', colour, mine: !!d.mine }]));
    setAdding(false);
    setStatus({ kind: 'info', text: 'Added ' + d.label + ' — press Sync to read it.' });
  }, []);
  const removeWallet = useCallback((w) => {
    putWallets(wRef.current.filter((x) => x.id !== w.id));
    const nb = Object.assign({}, bRef.current); delete nb[w.id]; putBooks(nb);
    const ne = Object.assign({}, eRef.current); delete ne[w.id]; putEvents(ne);
    const ns = Object.assign({}, syRef.current); delete ns[w.id]; putSynced(ns);
    if (sel === w.id) setSel(null);
  }, [sel]);

  if (!ready) return <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center',
    color: C.ink3, fontFamily: MONO, fontSize: 13 }}>Loading…</div>;

  const TABS = [['activity', 'Activity'], ['markets', 'Markets'], ['wallets', 'Wallets']];
  return (
    <div style={{ minHeight: '100vh' }}>
      <div style={{ position: 'sticky', top: 0, zIndex: 50, background: 'rgba(255,255,255,0.93)',
        backdropFilter: 'blur(10px)', borderBottom: '1px solid ' + C.border }}>
        <div style={{ maxWidth: 1180, margin: '0 auto', padding: '11px 18px', display: 'flex',
          alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
            <span style={{ width: 8, height: 8, background: C.blue, borderRadius: 2 }} />
            <span style={{ fontSize: 13.5, fontWeight: 700, letterSpacing: 0.2 }}>Wallet Watch</span>
            <span title={'Build ' + APP_VERSION + ' — ' + APP_BUILT} style={{ fontFamily: MONO,
              fontSize: 11, color: C.blue, background: C.blue + '18',
              border: '1px solid ' + C.blue + '3A', borderRadius: 4, padding: '1px 6px',
              fontWeight: 700 }}>{APP_VERSION}</span>
          </div>
          <div style={{ display: 'flex', gap: 3, background: C.card,
            border: '1px solid ' + C.border, borderRadius: 8, padding: 3 }}>
            {TABS.map((t) => (
              <button key={t[0]} onClick={() => setTab(t[0])} style={{
                background: tab === t[0] ? C.border : 'transparent',
                color: tab === t[0] ? C.ink : C.ink3, border: 'none', borderRadius: 6,
                padding: '6px 13px', font: 'inherit', fontSize: 12.5, fontWeight: 600,
                cursor: 'pointer' }}>{t[1]}</button>
            ))}
          </div>
          <span style={{ flex: 1 }} />
          <span style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            <span style={{ fontSize: 10.5, letterSpacing: 0.7, textTransform: 'uppercase',
              color: C.ink3, fontWeight: 700 }}>Window</span>
            {WINDOWS.map((x) => (
              <Chip key={x.h} on={win === x.h} onClick={() => setWin(x.h)}>{x.l}</Chip>
            ))}
          </span>
          <Btn onClick={() => setConn(true)} title="How this page reaches Polymarket">
            {relay ? 'Connection \u00b7 relay' : 'Connection'}
          </Btn>
          {syncing
            ? <Btn onClick={() => { Progress.stopped = true; }}>Stop</Btn>
            : null}
          {/* A click event is truthy, so the handler must not take it as
              "read everything". */}
          <Btn kind="primary" onClick={() => sync(false)} disabled={syncing || !wallets.length}>
            {syncing ? 'Syncing…' : 'Sync'}
          </Btn>
          <IconBtn title="Re-read all history from scratch"
            onClick={() => { if (!syncing && wallets.length) sync(true); }}>{REDO}</IconBtn>
        </div>
        {status && (
          <div style={{ borderTop: '1px solid ' + C.border,
            background: status.kind === 'error' ? C.red + '12' : C.cardAlt }}>
            <div style={{ maxWidth: 1180, margin: '0 auto', padding: '8px 18px', fontSize: 12.5,
              color: status.kind === 'error' ? C.red : C.ink3, display: 'flex', gap: 10 }}>
              <span style={{ fontFamily: MONO, color: status.kind === 'error' ? C.red
                : status.kind === 'ok' ? C.green : C.blue }}>
                {status.kind === 'error' ? '!' : status.kind === 'ok' ? '✓' : '…'}
              </span>
              <span>{status.text}</span>
              {status.kind === 'error' && /relay|Connection/i.test(status.text) && (
                <button onClick={() => setConn(true)} style={{ font: 'inherit', fontSize: 12.5,
                  fontWeight: 700, color: C.red, background: 'none', border: 'none',
                  textDecoration: 'underline', cursor: 'pointer', padding: 0, flexShrink: 0 }}>
                  Fix it
                </button>
              )}
            </div>
          </div>
        )}
      </div>

      <div style={{ maxWidth: 1180, margin: '0 auto', padding: '16px 18px 80px' }}>
        <WalletStrip wallets={wallets} books={books} counts={counts} sel={sel} hidden={hidden}
          onPick={(id) => { setSel(sel === id ? null : id); setTab('activity'); }}
          onHide={(id) => { setHidden(Object.assign({}, hidden, { [id]: !hidden[id] }));
            if (sel === id) setSel(null); }}
          onRemove={removeWallet} onAdd={() => setAdding(true)} />

        {!wallets.length ? (
          <Card><div style={{ padding: 30, textAlign: 'center' }}>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 7 }}>Nobody followed yet</div>
            <Tiny style={{ display: 'block', marginBottom: 16, lineHeight: 1.6 }}>
              Add a wallet address and press Sync. Start with your own and tick “this one is mine”,
              so everything you hold is watched from the off.
            </Tiny>
            <Btn kind="primary" onClick={() => setAdding(true)}>Add a wallet</Btn>
          </div></Card>
        ) : tab === 'activity' ? (
          <ActivityView events={feed} wallets={wallets} books={books} sel={sel}
            onClearSel={() => setSel(null)} now={now}
            onOpenMarket={(k) => { setFocus(k); setTab('markets');
              window.scrollTo({ top: 0, behavior: 'smooth' }); }} />
        ) : tab === 'markets' ? (
          <MarketsView markets={markets} index={index} wallets={wallets} books={books}
            events={marketEvents} watch={watch} focus={focus} now={now}
            onToggleWatch={toggleWatch} onUnfocus={() => setFocus(null)} />
        ) : (
          <WalletsView wallets={forMarkets} books={books} events={marketEvents} now={now} />
        )}
      </div>

      {conn && <ConnectionModal value={relay}
        onSave={(v) => { setRelay(v); setRelayV(v); Store.set(K_RELAY, v); setConn(false);
          setStatus({ kind: 'info', text: v ? 'Relay saved \u2014 press Sync.'
            : 'Relay cleared \u2014 calls go straight to Polymarket.' }); }}
        onClose={() => setConn(false)} />}
      {adding && <AddWallet onSave={addWallet} onClose={() => setAdding(false)}
        taken={wallets.map((w) => w.addr)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

<script>
/* Dependency loader. Each entry lists fallback URLs; the first one that
   defines its global wins. Keeps the app from silently rendering blank if a
   single CDN path moves. */
(function () {
  var DEPS = [
  {
    "name": "React",
    "global": "React",
    "urls": [
      "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"
    ]
  },
  {
    "name": "ReactDOM",
    "global": "ReactDOM",
    "urls": [
      "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
    ]
  },
  {
    "name": "PropTypes",
    "global": "PropTypes",
    "urls": [
      "https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"
    ]
  },
  {
    "name": "Babel",
    "global": "Babel",
    "urls": [
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.9/babel.min.js"
    ]
  }
];

  function loadOne(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('failed: ' + url)); };
      document.head.appendChild(s);
    });
  }

  function loadDep(dep) {
    if (window[dep.global]) return Promise.resolve();
    var i = 0;
    function attempt() {
      if (i >= dep.urls.length) {
        return Promise.reject(new Error(dep.name + ' could not be loaded'));
      }
      var url = dep.urls[i++];
      return loadOne(url).then(function () {
        if (!window[dep.global]) return attempt();
      }, attempt);
    }
    return attempt();
  }

  function fail(msg) {
    document.getElementById('root').innerHTML =
      '<div class="boot"><h1>Could not start</h1><p>' + msg + '</p>' +
      '<p><code>Check your network connection, then reload. No journal data is lost — ' +
      'everything you have logged stays in storage.</code></p></div>';
  }

  DEPS.reduce(function (chain, dep) {
    return chain.then(function () { return loadDep(dep); });
  }, Promise.resolve())
    .then(function () {
      var src = document.getElementById('app-source').textContent;
      var out = Babel.transform(src, { presets: ['react'] }).code;
      var el = document.createElement('script');
      el.textContent = out;
      document.body.appendChild(el);
    })
    .catch(function (e) {
      fail((e && e.message ? e.message : String(e)) +
        '. The app needs React and Babel to render.');
    });

  window.addEventListener('error', function (ev) {
    if (document.getElementById('root').childElementCount === 0) {
      fail('Runtime error: ' + (ev.message || 'unknown'));
    }
  });
})();
</script>
</body>
</html>
